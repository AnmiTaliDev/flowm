# flowm.conf - example configuration for flowm
#
# Copy to ~/.config/flowm/flowm.conf and edit.  Every line here shows
# the built-in default, so an empty file behaves identically.
# Lines starting with '#' or ';' are comments.

border_width      = 2
titlebar_height   = 22          ; 0 disables title bars entirely
font              = fixed       ; any core X font (see xlsfonts)

border_focused    = #4c7899
border_unfocused  = #333333
border_urgent     = #b03030
titlebar_focused  = #4c7899
titlebar_unfocused = #2a2a2a
title_text        = #ffffff


show_bar          = true
bar_bg            = #1c1c1c
bar_fg            = #d0d0d0
bar_ws_active     = #4c7899


workspaces        = 4           ; 1..16
focus_follows_mouse = false     ; true = sloppy focus
snap_distance     = 12          ; px, 0 disables edge snapping
move_step         = 24          ; px per keyboard move
resize_step       = 24          ; px per keyboard resize

# Optional workspace names (shown in the bar):
# workspace_name_1 = web
# workspace_name_2 = code
# workspace_name_3 = chat
# workspace_name_4 = misc


# log_file  = /home/user/.local/state/flowm.log
# log_level = info              ; debug | info | warn | error

#
# rule = MATCH option[,option...]
# MATCH is compared case-insensitively against WM_CLASS (instance and
# class); a trailing '*' makes it a prefix match.  First match wins.
# Options: workspace=N  center  maximize  fullscreen  size=WxH
#          position=X:Y
#
# rule = Firefox   workspace=2,maximize
# rule = mpv       center,size=960x540
# rule = Gimp*     workspace=4

#
# bind = CHORD ACTION [ARGS]
# Modifiers: shift, control/ctrl, alt/mod1, mod2..mod5, super/win/mod4.
# Key names are X keysyms (see xev / /usr/include/X11/keysymdef.h).
# Rebinding a chord replaces the default binding on that chord.
#
# Actions:
#   exec CMD             run CMD via /bin/sh
#   close | kill         close politely | force-kill
#   quit                 exit flowm
#   workspace N          switch to workspace N (1-based)
#   send_to_workspace N  move focused window to workspace N
#   workspace_next | workspace_prev
#   fullscreen | maximize | center | raise | lower
#   focus_next | focus_prev
#   move DX DY           keyboard move (multiples of move_step)
#   resize DW DH         keyboard resize (multiples of resize_step)

bind = Mod4+Return        exec xterm
bind = Mod4+d             exec dmenu_run
bind = Mod4+q             close
bind = Mod4+Shift+q       kill
bind = Mod4+Shift+e       quit
bind = Mod4+f             fullscreen
bind = Mod4+m             maximize
bind = Mod4+c             center
bind = Mod4+Tab           focus_next
bind = Mod4+Shift+Tab     focus_prev
bind = Mod4+r             raise
bind = Mod4+l             lower
bind = Mod4+Left          move -1 0
bind = Mod4+Right         move 1 0
bind = Mod4+Up            move 0 -1
bind = Mod4+Down          move 0 1
bind = Mod4+Shift+Left    resize -1 0
bind = Mod4+Shift+Right   resize 1 0
bind = Mod4+Shift+Up      resize 0 -1
bind = Mod4+Shift+Down    resize 0 1
bind = Mod4+1             workspace 1
bind = Mod4+2             workspace 2
bind = Mod4+3             workspace 3
bind = Mod4+4             workspace 4
bind = Mod4+Shift+1       send_to_workspace 1
bind = Mod4+Shift+2       send_to_workspace 2
bind = Mod4+Shift+3       send_to_workspace 3
bind = Mod4+Shift+4       send_to_workspace 4
bind = Mod4+period        workspace_next
bind = Mod4+comma         workspace_prev
