name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev pkg-config
      - name: Build
        run: make
      - name: Unit tests
        run: make test
      - name: Check shipped configuration
        run: ./flowm -t -c flowm.conf
      - name: Build utils
        run: make utils
      - name: Sanitizer build
        run: make debug
